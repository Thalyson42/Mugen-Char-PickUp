name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do core
        run: ./gradlew :core:test --no-daemon

      - name: Compilar APK (release, assinado com a chave fixa do projeto)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Nomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk Mugen-Char-PickUp.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Mugen-Char-PickUp-apk
          path: Mugen-Char-PickUp.apk

      - name: Publicar na Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mugen Char PickUp ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Baixe o `Mugen-Char-PickUp.apk` e instale. Para atualizar, instale o APK novo por cima do antigo.
          files: Mugen-Char-PickUp.apk
